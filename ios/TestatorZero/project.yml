name: TestatorZero
options:
  bundleIdPrefix: com.openesquire
  deploymentTarget:
    iOS: "17.0"
targets:
  TestatorZero:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
      - path: Secrets.plist
        optional: true
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Testator Zero
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "Your avatar listens so your memories can be spoken, not typed."
        NSSpeechRecognitionUsageDescription: "Speech is transcribed into memories for your corpus."
        NSCameraUsageDescription: "The avatar looks through your camera to describe a moment; only its words are kept, never the image."
        NSPhotoLibraryUsageDescription: "Show your avatar a photo; it keeps only its impression, never the image."
        NSLocalNetworkUsageDescription: "Sync your corpus from the Testament node on your own network."
        # the node is a device on the user's own LAN, served over plain HTTP
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSBonjourServices:
          - _http._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openesquire.testatorzero
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "52LY647P4B"
schemes:
  TestatorZero:
    build:
      targets:
        TestatorZero: all
    run:
      config: Debug
      storeKitConfiguration: TestatorZero.storekit
